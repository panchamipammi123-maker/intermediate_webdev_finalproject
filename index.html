<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interest Rate Calculator</title>
    <meta name="description" content="Simple Interest Rate Calculator - Calculate interest on principal, rate, and years easily. Perfect for investments and loans.">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Interest Rate Calculator</h1>
    
    <div class="container">
        <label for="principal">Principal Amount ($):</label>
        <input type="number" id="principal" placeholder="1000">
        
        <label for="rate">Interest Rate (%):</label>
        <input type="number" id="rate" placeholder="10">
        
        <label for="years">Years:</label>
        <input type="number" id="years" placeholder="1">
        
        <button onclick="calculate()">Calculate Interest</button>
        
        <p>Interest: $<span id="interest">0.00</span></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
