<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interest Rate Calculator</title>
    <meta name="description" content="Calculate simple interest rates for loans and investments">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Interest Rate Calculator</h1>
    <div>
        <label>Principal ($): <input type="number" id="principal"></label>
        <label>Rate (%): <input type="number" id="rate"></label>
        <label>Years: <input type="number" id="years"></label>
        <button onclick="calculateInterest()">Calculate</button>
        <p>Interest: $<span id="interest">0.00</span></p>
    </div>
    <script src="script.js"></script>
</body>
</html>
